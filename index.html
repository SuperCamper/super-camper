<!DOCTYPE html>
<html lang="km">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper Certificate Generator</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Koulen&display=swap" rel="stylesheet">

</head>

<body>

<div class="container">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <div class="sidebar">

        <h1>🏕️ Super Camper</h1>

        <!-- Template -->

        <label>ជ្រើស Template</label>

        <select id="templateSelect">

            <option value="ក្រហម.png">ក្រហម</option>
            <option value="បៃតង.png">បៃតង</option>
            <option value="លឿង.png">លឿង</option>
            <option value="ស្វាយ.png">ស្វាយ</option>
            <option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
            <option value="ខៀវ.png">ខៀវ</option>

        </select>

        <!-- Text -->

        <label>ឈ្មោះអ្នកទទួល</label>

        <input
            type="text"
            id="recipientName"
            placeholder="បញ្ចូលឈ្មោះ">

        <label>មូលហេតុទទួលវិញ្ញាបនបត្រ</label>

        <textarea
            id="reason"
            rows="4"
            placeholder="បញ្ចូលមូលហេតុ"></textarea>

        <label>ក្រុមពណ៌</label>

        <input
            type="text"
            id="groupColor"
            placeholder="ឧ. ក្រុមបៃតង">

        <!-- Photo -->

        <label>រូបថត</label>

        <input
            type="file"
            id="photoInput"
            accept="image/*">

        <hr>

        <!-- =========================
             CANVA TEXT EDITOR
        ========================== -->

        <h3>Text Editor</h3>

        <label>កែអត្ថបទ</label>

        <select id="targetText">

            <option value="namePreview">
                ឈ្មោះ
            </option>

            <option value="reasonPreview">
                មូលហេតុ
            </option>

            <option value="groupPreview">
                ក្រុម
            </option>

        </select>

        <label>Font</label>

        <select id="fontFamily">

            <option value="Battambang">
                Battambang
            </option>

            <option value="Koulen">
                Koulen
            </option>

            <option value="Arial">
                Arial
            </option>

        </select>

        <label>Font Size</label>

        <input
            type="range"
            id="fontSize"
            min="20"
            max="100"
            value="40">

        <label>Text Color</label>

        <input
            type="color"
            id="textColor"
            value="#ffffff">

        <label>Shadow Color</label>

        <input
            type="color"
            id="shadowColor"
            value="#000000">

        <label>

            <input
                type="checkbox"
                id="boldToggle">

            Bold

        </label>

        <label>

            <input
                type="checkbox"
                id="italicToggle">

            Italic

        </label>

        <label>X Position</label>

        <input
            type="range"
            id="xPos"
            min="-400"
            max="400"
            value="0">

        <label>Y Position</label>

        <input
            type="range"
            id="yPos"
            min="0"
            max="1100"
            value="500">

        <hr>

        <!-- =========================
             PHOTO EDITOR
        ========================== -->

        <h3>Photo Editor</h3>

        <label>Photo Width</label>

        <input
            type="range"
            id="photoWidth"
            min="50"
            max="400"
            value="120">

        <label>Photo Height</label>

        <input
            type="range"
            id="photoHeight"
            min="50"
            max="500"
            value="150">

        <label>Photo X</label>

        <input
            type="range"
            id="photoX"
            min="-400"
            max="400"
            value="0">

        <label>Photo Y</label>

        <input
            type="range"
            id="photoY"
            min="0"
            max="1100"
            value="300">

        <button id="downloadPNG">

            Download PNG

        </button>

        <button id="downloadPDF">

            Download PDF

        </button>

    </div>

    <!-- =========================
         PREVIEW
    ========================== -->

    <div class="preview-wrapper">

        <div id="certificate">

            <img
                id="photoPreview"
                class="photo-preview"
                alt="photo">

            <div
                id="namePreview"
                class="name-preview">

                ឈ្មោះអ្នកទទួល

            </div>

            <div
                id="reasonPreview"
                class="reason-preview">

                មូលហេតុទទួលវិញ្ញាបនបត្រ

            </div>

            <div
                id="groupPreview"
                class="group-preview">

                ក្រុម

            </div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
