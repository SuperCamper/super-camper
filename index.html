<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Super Camper V4</title>

<link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

<div class="sidebar">

<h2>🏕 Super Camper V4</h2>

<label>Template</label>
<select id="templateSelect">
<option value="ក្រហម.png">ក្រហម</option>
<option value="បៃតង.png">បៃតង</option>
<option value="លឿង.png">លឿង</option>
<option value="ស្វាយ.png">ស្វាយ</option>
<option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
<option value="ខៀវ.png">ខៀវ</option>
</select>

<label>ឈ្មោះ</label>
<input id="nameInput">

<label>មូលហេតុ</label>
<textarea id="reasonInput"></textarea>

<label>ក្រុម</label>
<input id="groupInput">

<label>រូបថត</label>
<input type="file" id="photoInput" accept="image/*">

<hr>

<h3>Text Editor</h3>

<label>Select Element</label>
<select id="targetText">
<option value="namePreview">ឈ្មោះ</option>
<option value="reasonPreview">មូលហេតុ</option>
<option value="groupPreview">ក្រុម</option>
</select>

<label>Font</label>
<select id="fontFamily">
<option value="Battambang">Battambang</option>
<option value="Moul">Moul</option>
</select>

<label>Font Size</label>
<input type="range" id="fontSize" min="20" max="100" value="50">

<label>Text Color</label>
<input type="color" id="textColor" value="#ffffff">

<label>Shadow Color</label>
<input type="color" id="shadowColor" value="#000000">

<label>
<input type="checkbox" id="bold">
Bold
</label>

<label>
<input type="checkbox" id="italic">
Italic
</label>

<hr>

<h3>Photo Size</h3>

<label>Width</label>
<input type="range" id="photoWidth" min="80" max="300" value="140">

<label>Height</label>
<input type="range" id="photoHeight" min="100" max="350" value="180">

<hr>

<button id="downloadPNG">
Download PNG
</button>

<button id="downloadPDF">
Download PDF
</button>

</div>

<div class="workspace">

<div id="certificate">

<img id="photoPreview">

<div id="namePreview" class="draggable">
ឈ្មោះ
</div>

<div id="reasonPreview" class="draggable">
មូលហេតុ
</div>

<div id="groupPreview" class="draggable">
ក្រុម
</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
