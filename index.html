<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Super Camper Certificate Generator</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <div class="sidebar">

        <h1>🏕️ Super Camper</h1>

        <label>ជ្រើស Template</label>
        <select id="templateSelect">
            <option value="ក្រហម.png">ក្រហម</option>
            <option value="បៃតង.png">បៃតង</option>
            <option value="លឿង.png">លឿង</option>
            <option value="ស្វាយ.png">ស្វាយ</option>
            <option value="ផ្កាឈូក.png">ផ្កាឈូក</option>
            <option value="ខៀវ.png">ខៀវ</option>
        </select>

        <label>ឈ្មោះអ្នកទទួល</label>
        <input
            type="text"
            id="recipientName"
            placeholder="បញ្ចូលឈ្មោះ">

        <label>មូលហេតុទទួលវិញ្ញាបនបត្រ</label>
        <textarea
            id="reason"
            rows="4"
            placeholder="បញ្ចូលការសរសើរ"></textarea>

        <label>ពណ៌ក្រុម</label>
        <input
            type="text"
            id="groupColor"
            placeholder="ឧ. ក្រុមបៃតង">

        <label>រូបថតអ្នកទទួល</label>
        <input
            type="file"
            id="photoInput"
            accept="image/*">

        <button id="downloadPNG">
            Download PNG
        </button>

        <button id="downloadPDF">
            Download PDF
        </button>

    </div>

    <!-- Preview -->
    <div class="preview-wrapper">

        <div id="certificate">

            <img
                id="photoPreview"
                class="photo-preview"
                alt="photo">

            <div id="namePreview" class="name-preview">
                ឈ្មោះអ្នកទទួល
            </div>

            <div id="reasonPreview" class="reason-preview">
                មូលហេតុទទួលវិញ្ញាបនបត្រ
            </div>

            <div id="groupPreview" class="group-preview">
                ក្រុម
            </div>

        </div>

    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="app.js"></script>

</body>
</html>
